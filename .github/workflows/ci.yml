name: Validate and package Chrome extension

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run package
      - name: Test the release package in Chromium
        run: |
          (cd dist && sha256sum --check extension-chrome-v*.zip.sha256)
          unzip -q dist/extension-chrome-v*.zip -d "$RUNNER_TEMP/design-lens"
          DESIGN_LENS_EXTENSION_PATH="$RUNNER_TEMP/design-lens" node --test --test-concurrency=1 tests/*.browser.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chrome-extension
          path: |
            dist/extension-chrome-v*.zip
            dist/extension-chrome-v*.zip.sha256
          if-no-files-found: error
