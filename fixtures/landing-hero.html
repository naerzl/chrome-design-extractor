<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Landing Hero / private-fixture-title-4c81ad</title>
  <style>
    :root {
      --brand: #4f46e5;
      --brand-2: #7c3aed;
      --ink: #0f172a;
      --muted: #475569;
      --line: #e2e8f0;
      color-scheme: light;
      font: 16px/1.6 system-ui, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      background: #ffffff;
      color: var(--ink);
    }

    header {
      border-bottom: 1px solid var(--line);
    }

    nav {
      display: flex;
      align-items: center;
      gap: 24px;
      padding: 18px 32px;
    }

    nav a {
      color: inherit;
      text-decoration: none;
    }

    .hero {
      padding: 96px 32px;
      color: #ffffff;
      background: linear-gradient(135deg, var(--brand), var(--brand-2));
    }

    .hero h1 {
      margin: 0 0 16px;
      font-size: 44px;
      line-height: 1.1;
    }

    .hero p {
      max-width: 46ch;
      margin: 0 0 28px;
      color: #ede9fe;
    }

    .cta-primary,
    .cta-secondary {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      padding: 0 22px;
      border-radius: 999px;
      font: inherit;
      font-weight: 600;
      text-decoration: none;
    }

    .cta-primary {
      border: 0;
      background: #ffffff;
      color: var(--ink);
    }

    .cta-secondary {
      border: 1px solid rgba(255, 255, 255, 0.6);
      background: transparent;
      color: #ffffff;
    }

    .hero .more { color: #ffffff; }

    .features {
      padding: 72px 32px;
    }

    .features h2 { font-size: 28px; }
  </style>
</head>
<body>
  <header>
    <nav aria-label="Primary">
      <a href="#features">Product</a>
      <a href="#features">Pricing</a>
      <a href="#features">Docs</a>
    </nav>
  </header>
  <main>
    <section class="hero">
      <h1>Ship polished interfaces in hours</h1>
      <p>One place for tokens, components, and motion.</p>
      <button type="button" class="cta-primary">Start building</button>
      <a class="cta-secondary" href="#features">Book a demo</a>
      <a class="more" href="#features">Read the docs</a>
    </section>
    <section class="features" id="features">
      <h2>Everything you need</h2>
      <p>A design system your team can actually ship.</p>
    </section>
  </main>
</body>
</html>
